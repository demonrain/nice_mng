name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]

# 让 checkout / setup 等 JS Action 使用 Node.js 24 运行时，消除 Node 20 弃用告警
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CI 固定使用单一 provider 校验，避免多 provider 漂移（见 docs/migration.md）
      DB_PROVIDER: postgresql
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nice_admin?schema=public
    steps:
      - uses: actions/checkout@v4

      # 不指定 version，由根 package.json 的 packageManager(pnpm@9.1.0) 决定，避免版本冲突
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 未提交 pnpm-lock.yaml，故不启用 cache: pnpm（缓存依赖 lockfile）
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # 无 lockfile 时用 --no-frozen-lockfile；提交 lockfile 后可改回 --frozen-lockfile 并恢复缓存
        run: pnpm install --no-frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @nice-admin/shared build

      - name: Prisma 校验（schema + provider 一致性）
        working-directory: apps/api
        run: |
          node scripts/set-db-provider.mjs
          npx prisma validate
          npx prisma generate

      - name: 校验 migrations 与 schema 同步（仅 PR）
        if: github.event_name == 'pull_request'
        working-directory: apps/api
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --exit-code || (echo "::error::schema 与 migrations 不一致，请执行 pnpm --filter @nice-admin/api prisma:migrate 生成迁移" && exit 1)
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Build API
        run: pnpm --filter @nice-admin/api build

      - name: Build Web
        run: pnpm --filter @nice-admin/web build
