# MySQL 版部署（独立使用，不要和 docker-compose.yml 同时启动）
# 用法：docker compose -f docker-compose.mysql.yml up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: nice-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pwd_change_me}
      MYSQL_DATABASE: ${MYSQL_DB:-nice_admin}
      MYSQL_USER: ${MYSQL_USER:-nice}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nice_pwd_change_me}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./docker/volumes/mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD:-root_pwd_change_me}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nice-net

  redis:
    image: redis:7-alpine
    container_name: nice-redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - ./docker/volumes/redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nice-net

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        DB_PROVIDER: mysql
    container_name: nice-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      API_PORT: 3000
      API_PREFIX: ${API_PREFIX:-/api}
      DB_PROVIDER: mysql
      DATABASE_URL: mysql://${MYSQL_USER:-nice}:${MYSQL_PASSWORD:-nice_pwd_change_me}@mysql:3306/${MYSQL_DB:-nice_admin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-please_change_this_access_secret}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-2h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-please_change_this_refresh_secret}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - ./docker/volumes/uploads:/app/uploads
    networks:
      - nice-net

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: nice-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'
    networks:
      - nice-net

networks:
  nice-net:
    driver: bridge
